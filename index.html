<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="manifest" href="favicon/site.webmanifest">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIYKO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #121316;
    --line: rgba(255,255,255,.08);
    --text: #f4f3ef;
    --muted: #9b9b93;
    --accent: #a3b18a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; letter-spacing: -.02em; }
  a { color: inherit; text-decoration: none; }
  
  .wrap {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    padding: 60px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .logo { height: 56px; width: auto; margin-bottom: 48px; }
  
  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .25em;
    color: var(--accent);
    margin-bottom: 16px;
    display: block;
  }

  h1 {
    font-size: clamp(40px, 6vw, 64px);
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 17px;
    max-width: 480px;
    margin-bottom: 48px;
  }

  .contact-form {
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 32px;
    border-radius: 4px;
  }

  .form-group { margin-bottom: 20px; }
  
  .form-group label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 2px;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }

  .btn {
    display: inline-block;
    width: 100%;
    padding: 16px 34px;
    border: 1px solid var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .2em;
    transition: .3s;
    cursor: pointer;
    background: var(--accent);
    color: #0a0a0b;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    border-radius: 2px;
  }

  .btn:hover {
    background: transparent;
    color: var(--accent);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 32px 24px;
    text-align: center;
  }

  footer small {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .05em;
  }

  @media(max-width: 600px) {
    .wrap { padding: 40px 20px; }
    .contact-form { padding: 24px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <img src="logo2.png" alt="WIYKO" class="logo">
  
  <span class="label">Excellence is a habit, not a moment.</span>
  <h1>Ultra Exclusive Club</h1>
  <p class="subtitle">Leave your details below to get in touch.</p>

  <form action="https://api.web3forms.com/submit" method="POST" class="contact-form" id="contactForm">
    <input type="hidden" name="access_key" value="65bb33ff-0316-4d93-9879-f4e3d82dfc52">
    <input type="hidden" name="subject" value="New Inquiry via WIYKO.COM">
    <input type="hidden" name="redirect" value="https://web3forms.com/success"> 
    
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required placeholder="Your name">
    </div>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">
    </div>
    
    <div class="form-group">
      <label for="message">Message (Optional)</label>
      <textarea id="message" name="message" rows="3" placeholder="What are you looking forward to?"></textarea>
    </div>
    
    <button type="submit" class="btn" id="submitBtn">Notify Me</button>
  </form>
</div>

<footer>
  <small>© 2026 WIYKO. All rights reserved.</small>
</footer>

<script>
  const form = document.getElementById('contactForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'Sending...';
    submitBtn.disabled = true;

    const formData = new FormData(form);
    const object = Object.fromEntries(formData);
    const json = JSON.stringify(object);

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: json
    })
    .then(async (response) => {
      let json = await response.json();
      if (response.status === 200) {
        submitBtn.textContent = 'Message Sent';
        form.reset();
      } else {
        submitBtn.textContent = 'Error. Try Again.';
      }
    })
    .catch(error => {
      submitBtn.textContent = 'Error. Try Again.';
    })
    .finally(() => {
      setTimeout(() => {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }, 3000);
    });

    e.preventDefault();
  });
</script>

</body>
</html>
